services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; assert urlopen('http://localhost:8000/health', timeout=3).status == 200"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    command: python -m uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.example
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    command: npm run dev -- --hostname 0.0.0.0 --webpack

volumes:
  backend_venv:
  frontend_node_modules:
  frontend_next:
